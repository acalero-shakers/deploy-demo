<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Deploy Demo</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #0d1117 0%, #161b22 100%);
      color: #e6edf3;
    }
    .card {
      text-align: center;
      padding: 64px 80px;
      border: 1px solid #30363d;
      border-radius: 16px;
      background: rgba(22, 27, 34, 0.8);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
    }
    h1 { font-size: 48px; letter-spacing: -1px; margin-bottom: 12px; }
    p { color: #8b949e; font-size: 18px; margin-bottom: 28px; }
    .badge {
      display: inline-block;
      padding: 8px 20px;
      border-radius: 999px;
      background: #1f6feb22;
      border: 1px solid #1f6feb;
      color: #58a6ff;
      font-family: ui-monospace, "SF Mono", monospace;
      font-size: 15px;
    }
    .pipeline { margin-top: 28px; font-family: ui-monospace, monospace; font-size: 13px; color: #8b949e; }
  </style>
</head>
<body>
  <div class="card">
    <h1>🚀 Deploy Demo</h1>
    <p>Static site deployed to GitHub Pages via GitHub Actions</p>
    <span class="badge">v1.0</span>
    <div class="pipeline">git push → Actions build → Pages deploy</div>
  </div>
</body>
</html>
